<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc">
  <title id="title">EcoFlutuador — conexões físicas informadas entre Raspberry Pi, ESP32 e OLED</title>
  <desc id="desc">Raspberry GPIO14, pino físico 8, liga a RX2 GPIO16 da ESP32; GPIO15, pino físico 10, recebe de TX2 GPIO17. GND é compartilhado; o pino físico GND escolhido na Raspberry está pendente de confirmação. O OLED liga GPIO22 a SCL, GPIO23 a SDA, 3V3 a VCC e GND a GND, conforme a pinagem confirmada e o firmware. Os desenhos dos conectores são funcionais, sem representar sua posição física real.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e8edf3" stroke-width="1"/></pattern>
    <marker id="uart-tx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0284c7"/></marker>
    <marker id="uart-rx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#16803c"/></marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172b40; }
    .title { font-size: 32px; font-weight: 700; }
    .board-title { font-size: 27px; font-weight: 700; fill: #ffffff; }
    .board-sub { font-size: 17px; fill: #e7f4ef; }
    .pin { font-size: 19px; font-weight: 700; }
    .small { font-size: 16px; }
    .medium { font-size: 19px; }
    .wire-label { font-size: 18px; font-weight: 700; }
    .wire { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .contact { fill: #f3c969; stroke: #74561a; stroke-width: 2; }
  </style>
  <rect width="1600" height="1140" fill="#f8fafc"/>
  <rect x="24" y="208" width="1552" height="551" rx="16" fill="url(#grid)"/>
  <text x="48" y="55" class="title">EcoFlutuador · montagem física informada</text>
  <text x="48" y="84" class="medium">UART cruzada entre as placas · OLED alimentado pela saída 3V3 da ESP32</text>
  <rect x="40" y="105" width="1520" height="87" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="135" class="pin">OLED I²C: GPIO22 → SCL · GPIO23 ↔ SDA</text>
  <text x="60" y="166" class="medium">Wire.begin(23, 22) · SDA23 / SCL22 · endereço 0x3C no firmware</text>

  <!-- Representações funcionais: os terminais não reproduzem a ordem física dos conectores. -->
  <g id="raspberry-pi">
    <rect x="50" y="230" width="365" height="485" rx="24" fill="#238052" stroke="#125033" stroke-width="3"/>
    <circle cx="70" cy="250" r="8" fill="#f8fafc" stroke="#125033" stroke-width="3"/>
    <circle cx="395" cy="695" r="8" fill="#f8fafc" stroke="#125033" stroke-width="3"/>
    <text x="74" y="281" class="board-title">Raspberry Pi 5</text>
    <text x="74" y="311" class="board-sub">Conector GPIO de 40 pinos</text>
    <rect x="67" y="342" width="332" height="64" rx="8" fill="#ecf6f0"/>
    <text x="81" y="369" class="pin">TXD · GPIO14 (BCM)</text>
    <text x="81" y="391" class="small">Pino físico 8 · saída UART</text>
    <rect x="67" y="414" width="332" height="64" rx="8" fill="#ecf6f0"/>
    <text x="81" y="441" class="pin">RXD · GPIO15 (BCM)</text>
    <text x="81" y="463" class="small">Pino físico 10 · entrada UART</text>
    <rect x="67" y="505" width="332" height="86" rx="8" fill="#ecf6f0"/>
    <text x="81" y="533" class="pin">GND · terra comum</text>
    <text x="81" y="556" class="small">Pino físico escolhido:</text>
    <text x="81" y="578" class="small" font-weight="700">Pendente de confirmação</text>
    <rect x="74" y="619" width="98" height="54" rx="5" fill="#d6dde5" stroke="#0f3d28" stroke-width="2"/>
    <text x="87" y="652" class="small">USB</text>
    <text x="191" y="640" class="board-sub">Alimentação da Pi:</text>
    <text x="191" y="663" class="board-sub">a confirmar</text>
  </g>

  <g id="esp32">
    <rect x="620" y="230" width="355" height="485" rx="22" fill="#204e60" stroke="#122f3b" stroke-width="3"/>
    <circle cx="640" cy="250" r="8" fill="#f8fafc" stroke="#122f3b" stroke-width="3"/>
    <circle cx="955" cy="695" r="8" fill="#f8fafc" stroke="#122f3b" stroke-width="3"/>
    <text x="645" y="281" class="board-title">ESP32-WROOM-32</text>
    <text x="645" y="311" class="board-sub">Placa e ordem dos pinos: a confirmar</text>
    <rect x="636" y="343" width="324" height="66" rx="8" fill="#edf4f7"/>
    <text x="649" y="375" class="pin">RX2</text><text x="649" y="397" class="small">GPIO16</text>
    <text x="947" y="375" text-anchor="end" class="pin">D22 · GPIO22</text>
    <text x="947" y="397" text-anchor="end" class="small">→ SCL</text>
    <rect x="636" y="416" width="324" height="66" rx="8" fill="#edf4f7"/>
    <text x="649" y="448" class="pin">TX2</text><text x="649" y="470" class="small">GPIO17</text>
    <text x="947" y="448" text-anchor="end" class="pin">D23 · GPIO23</text>
    <text x="947" y="470" text-anchor="end" class="small">↔ SDA</text>
    <rect x="636" y="506" width="324" height="58" rx="8" fill="#edf4f7"/>
    <text x="650" y="541" class="pin">GND</text>
    <path d="M 708 535 H 887" stroke="#334155" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="947" y="541" text-anchor="end" class="pin">GND</text>
    <rect x="797" y="583" width="163" height="54" rx="8" fill="#fff0f0"/>
    <text x="947" y="617" text-anchor="end" class="pin">3V3 · saída</text>
    <text x="645" y="661" class="board-sub">Entrada de alimentação da ESP32:</text>
    <text x="645" y="686" class="board-sub">Pendente de confirmação</text>
  </g>

  <g id="oled">
    <rect x="1210" y="230" width="340" height="485" rx="20" fill="#233451" stroke="#14223a" stroke-width="3"/>
    <text x="1234" y="279" class="board-title">OLED · SSD1306</text>
    <text x="1234" y="308" class="board-sub">128 × 64 · I²C</text>
    <rect x="1225" y="343" width="95" height="66" rx="8" fill="#f1f4fa"/>
    <text x="1241" y="383" class="pin">SCL</text>
    <rect x="1225" y="416" width="95" height="66" rx="8" fill="#f1f4fa"/>
    <text x="1241" y="456" class="pin">SDA</text>
    <rect x="1225" y="506" width="95" height="58" rx="8" fill="#f1f4fa"/>
    <text x="1241" y="543" class="pin">GND</text>
    <rect x="1225" y="583" width="95" height="54" rx="8" fill="#fff0f0"/>
    <text x="1241" y="618" class="pin">VCC</text>
    <rect x="1335" y="350" width="197" height="176" rx="10" fill="#090f18" stroke="#5e7b96" stroke-width="3"/>
    <text x="1351" y="390" fill="#86efac" style="fill:#86efac; font-size:19px">CMD: w</text>
    <text x="1351" y="420" style="fill:#a1c4e0; font-size:16px">Dist: 12.0 cm</text>
    <text x="1351" y="449" style="fill:#a1c4e0; font-size:16px">Ambos: avancar</text>
    <text x="1351" y="475" style="fill:#a1c4e0; font-size:16px">Exemplo de leitura</text>
    <text x="1335" y="566" class="board-sub">0x3C no firmware;</text>
    <text x="1335" y="591" class="board-sub">endereço real:</text>
    <text x="1335" y="616" class="board-sub">a confirmar</text>
    <text x="1234" y="666" class="board-sub">Posição física de cada terminal:</text>
    <text x="1234" y="692" class="board-sub">Pendente de confirmação</text>
  </g>

  <!-- Somente as sete ligações fornecidas pelo usuário. -->
  <g id="confirmed-wires">
    <path id="pi-tx-to-esp-rx" class="wire" d="M 415 375 H 616" stroke="#0284c7" marker-end="url(#uart-tx)" data-source-component="Raspberry Pi" data-source-pin="GPIO14" data-target-component="ESP32" data-target-pin="GPIO16" data-signal="UART_TX"/>
    <path id="esp-tx-to-pi-rx" class="wire" d="M 620 445 H 419" stroke="#16803c" marker-end="url(#uart-rx)" data-source-component="ESP32" data-source-pin="GPIO17" data-target-component="Raspberry Pi" data-target-pin="GPIO15" data-signal="UART_RX"/>
    <path id="pi-gnd-to-esp-gnd" class="wire" d="M 415 535 H 620" stroke="#334155" data-source-component="Raspberry Pi" data-source-pin="GND" data-target-component="ESP32" data-target-pin="GND" data-signal="GND"/>
    <path id="esp-scl-to-oled-scl" class="wire" d="M 975 375 H 1210" stroke="#d97706" data-source-component="ESP32" data-source-pin="GPIO22" data-target-component="OLED" data-target-pin="SCL" data-signal="I2C_SCL"/>
    <path id="esp-sda-to-oled-sda" class="wire" d="M 975 445 H 1210" stroke="#7c3aed" data-source-component="ESP32" data-source-pin="GPIO23" data-target-component="OLED" data-target-pin="SDA" data-signal="I2C_SDA"/>
    <path id="esp-gnd-to-oled-gnd" class="wire" d="M 975 535 H 1210" stroke="#334155" data-source-component="ESP32" data-source-pin="GND" data-target-component="OLED" data-target-pin="GND" data-signal="GND"/>
    <path id="esp-3v3-to-oled-vcc" class="wire" d="M 975 610 H 1210" stroke="#dc2626" data-source-component="ESP32" data-source-pin="3V3" data-target-component="OLED" data-target-pin="VCC" data-signal="3V3"/>
  </g>
  <g id="contacts">
    <circle cx="415" cy="375" r="7" class="contact"/><circle cx="620" cy="375" r="7" class="contact"/>
    <circle cx="415" cy="445" r="7" class="contact"/><circle cx="620" cy="445" r="7" class="contact"/>
    <circle cx="415" cy="535" r="7" class="contact"/><circle cx="620" cy="535" r="7" class="contact"/>
    <circle cx="975" cy="375" r="7" class="contact"/><circle cx="1210" cy="375" r="7" class="contact"/>
    <circle cx="975" cy="445" r="7" class="contact"/><circle cx="1210" cy="445" r="7" class="contact"/>
    <circle cx="975" cy="535" r="7" class="contact"/><circle cx="1210" cy="535" r="7" class="contact"/>
    <circle cx="975" cy="610" r="7" class="contact"/><circle cx="1210" cy="610" r="7" class="contact"/>
  </g>
  <text x="517" y="355" text-anchor="middle" class="wire-label" style="fill:#0369a1">UART · comandos →</text>
  <text x="517" y="425" text-anchor="middle" class="wire-label" style="fill:#166534">← respostas</text>
  <text x="517" y="515" text-anchor="middle" class="wire-label">GND comum</text>
  <text x="1092" y="355" text-anchor="middle" class="wire-label" style="fill:#92400e">I²C · clock SCL →</text>
  <text x="1092" y="425" text-anchor="middle" class="wire-label" style="fill:#6d28d9">I²C · SDA ↔</text>
  <text x="1092" y="515" text-anchor="middle" class="wire-label">GND comum</text>
  <text x="1092" y="590" text-anchor="middle" class="wire-label" style="fill:#b91c1c">3,3 V → VCC</text>

  <rect x="40" y="785" width="1520" height="141" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="62" y="819" class="pin">Legenda · cores e nomes identificam a função de cada jumper</text>
  <path d="M 64 850 H 116" stroke="#dc2626" stroke-width="7"/><text x="130" y="856" class="medium">3,3 V / alimentação</text>
  <path d="M 460 850 H 512" stroke="#334155" stroke-width="7"/><text x="526" y="856" class="medium">GND / referência elétrica</text>
  <path d="M 930 850 H 982" stroke="#0284c7" stroke-width="7"/><text x="996" y="856" class="medium">UART / Pi → ESP32</text>
  <path d="M 64 891 H 116" stroke="#16803c" stroke-width="7"/><text x="130" y="897" class="medium">UART / ESP32 → Pi</text>
  <path d="M 460 891 H 512" stroke="#d97706" stroke-width="7"/><text x="526" y="897" class="medium">I²C / SCL</text>
  <path d="M 930 891 H 982" stroke="#7c3aed" stroke-width="7"/><text x="996" y="897" class="medium">I²C / SDA</text>
  <text x="48" y="965" class="medium" font-weight="700">GPIO (BCM) não é o número físico: GPIO14 = pino 8; GPIO15 = pino 10 no conector da Raspberry.</text>
  <text x="48" y="1000" class="medium">Diagrama funcional, sem escala. Identifique cada terminal pela serigrafia; não copie sua posição no desenho.</text>
  <text x="48" y="1032" class="medium">A posição do GND na Pi e a ordem dos conectores da ESP32 e do OLED estão pendentes de confirmação.</text>
  <text x="48" y="1064" class="medium">Não foi informada ligação de alimentação entre Pi e ESP32. Câmera USB e ESCs não integram estes sete jumpers.</text>
  <text x="48" y="1101" class="small">Pinagem OLED confirmada: 16/10/2026 · SCL22 / SDA23 · consulte docs/HARDWARE.md</text>
</svg>
