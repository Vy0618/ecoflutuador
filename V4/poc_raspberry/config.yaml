# EcoFlutuador POC - Configuration
# Copie para config.local.yaml e ajuste se necessário

camera:
  backend: "V4L2"  # PICAMERA2 para RPi CSI, V4L2 para USB Linux, ANY para Windows/macOS
  index: 0
  timeout_s: 1.0
  width: 320
  height: 240
  fps: 10
  buffer_size: 1
  # Para Picamera2: configurações avançadas
  picamera2:
    format: "RGB888"  # ou "XRGB8888", "YUV420"
    transform: {}     # ex: {"hflip": true, "vflip": true}

model:
  backend: "legacy_ssd" # Known incompatible files: use explicit mock only for tests
  version: null
  weights: "models/frozen_inference_graph.pb"
  config: "models/ssd_mobilenet_v3_large_coco_2020_01_14.pbtxt"
  classes: "models/coco.names"
  input_size: [320, 320]
  conf_threshold: 0.45
  nms_threshold: 0.2
  target_classes: ["bottle"]

serial:
  port: "/dev/serial0"  # UART GPIO da Raspberry; use /dev/ttyUSB0 apenas durante teste USB
  baudrate: 115200
  timeout: 1.0
  reconnect_delay: 2.0
  require_control_lease: true
  heartbeat_s: 0.5
  auto_detect: false  # evita conectar acidentalmente em outro dispositivo serial

decision:
  target_classes: [bottle, plastic_bottle, plastic_bag]
  fauna_classes: [fish, turtle, bird]
  fauna_priority: true
  confidence_threshold: 0.45
  confirmation_frames: 3
  loss_timeout_s: 0.5
  hysteresis_fraction: 0.04
  zones: 3  # esquerda/centro/direita
  send_only_on_change: true
  default_command: "s"  # STOP quando sem detecção
  # frame_width será obtido dinamicamente do frame (não hardcoded)

api:
  enabled: true
  host: "0.0.0.0"
  port: 8080

logging:
  level: "INFO"
  format: "json"  # cada linha = JSON válido

performance:
  target_fps: 10
  max_inference_ms: 300

recognition:
  window_s: 15.0
  confirmation_s: 0.1
  detection_timeout_s: 2.0
  telemetry_timeout_s: 3.0

telemetry:
  device_id: eco-01
  interval_s: 5.0
  server_url: null # Reserved for remote exporter; currently local observation
