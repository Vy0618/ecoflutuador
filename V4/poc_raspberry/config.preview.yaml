# Perfil exclusivo da visualizacao local; nao configura controle de motores.
camera:
  backend: V4L2
  index: 0
  width: 640
  height: 480
  fps: 10
  timeout_s: 2.0
model:
  backend: legacy_ssd
  version: ssd_mobilenet_v1_coco_2017_11_17
  weights: models/ssd_mobilenet_v1_coco_2017_11_17.pb
  config: models/ssd_mobilenet_v1_coco_2017_11_17.pbtxt
  classes: models/coco_ssd.names
  input_size: [300, 300]
  # Este grafo ja normaliza pixels internamente; nao normalizar duas vezes.
  input_scale: 1.0
  input_mean: [0, 0, 0]
  conf_threshold: 0.45
  nms_threshold: 0.2
  target_classes: [bottle]
decision:
  target_classes: [bottle]
  fauna_classes: []
  fauna_priority: true
  confidence_threshold: 0.45
  confirmation_frames: 3
  loss_timeout_s: 0.5
  hysteresis_fraction: 0.04
  zones: 3
api:
  enabled: false
