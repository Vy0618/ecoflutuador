[platformio]
default_envs = esp32
src_dir = .

[env:esp32]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<ControleESP32.ino> +<ControleESP32.ino.cpp>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.0
    adafruit/Adafruit GFX Library@^1.12.0

[env:esp32-usb]
extends = env:esp32
build_flags = -DECO_SERIAL_USB=1
